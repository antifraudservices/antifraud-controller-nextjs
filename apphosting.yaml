runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512

env:
  - variable: ANTIFRAUD_DEPLOYMENT_STAGE
    value: beta
    availability: [RUNTIME]
  - variable: ANTIFRAUD_GATEWAY_BASE_URL
    value: https://antifraud-gw-temp-788157665132.us-central1.run.app
    availability: [RUNTIME]
  - variable: ANTIFRAUD_GATEWAY_BEARER
    secret: antifraud-controller-bff-token-temp
    availability: [RUNTIME]
  - variable: CONTROLLER_DEMO_MODE
    value: "true"
    availability: [RUNTIME]
  - variable: CONTROLLER_DEPLOYMENT_STAGE
    value: beta
    availability: [RUNTIME]
  - variable: CONTROLLER_PORTAL_HOST_PROFILES_JSON
