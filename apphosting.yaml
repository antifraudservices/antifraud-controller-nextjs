runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512

env:
  - variable: ANTIFRAUD_DEPLOYMENT_STAGE
    value: beta
    availability: [RUNTIME]
  - variable: ANTIFRAUD_GATEWAY_BASE_URL
    value: https://antifraud-gw-beta-982931712028.us-central1.run.app
    availability: [RUNTIME]
  - variable: ANTIFRAUD_GATEWAY_BEARER
    secret: antifraud-demo-controller-bff-token
    availability: [RUNTIME]
  - variable: TERMINOLOGY_BASE_URL
    value: https://antifraud-terminology-beta-982931712028.us-central1.run.app
    availability: [RUNTIME]
  - variable: TERMINOLOGY_SERVICE_TOKEN
    secret: antifraud-demo-terminology-token
    availability: [RUNTIME]
  - variable: CONTROLLER_DEMO_MODE
    value: "true"
    availability: [RUNTIME]
  - variable: CONTROLLER_DEPLOYMENT_STAGE
    value: beta
    availability: [RUNTIME]
  - variable: ANTIFRAUD_NETWORK_KIND
    value: demo
    availability: [BUILD, RUNTIME]
  - variable: ANTIFRAUD_DEMO_RETENTION_DAYS
    value: "7"
    availability: [RUNTIME]
  - variable: ANTIFRAUD_TEST_NETWORK_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: ANTIFRAUD_PRODUCTION_ENABLED
    value: "false"
    availability: [RUNTIME]
