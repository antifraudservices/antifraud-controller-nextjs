  - variable: ANTIFRAUD_NETWORK_KIND
    value: demo
    availability: [BUILD, RUNTIME]
  - variable: ANTIFRAUD_DEMO_RETENTION_DAYS
    value: "7"
    availability: [RUNTIME]
  - variable: ANTIFRAUD_TEST_NETWORK_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: ANTIFRAUD_PRODUCTION_ENABLED
    value: "false"
    availability: [RUNTIME]
